<!doctype html>
<!-- Document en français, conformément au public visé (recruteurs francophones) -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon fourni par le scaffold Vite, à remplacer plus tard par un logo personnel si besoin -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre de page : reprend l'exemple donné dans le cahier des charges (section 24. SEO) -->
    <title>Maurel Kouassi — Développeur Web</title>

    <!-- Meta description : résume la vitrine pour les moteurs de recherche -->
    <meta
      name="description"
      content="Portfolio de Maurel Kouassi, développeur web front-end. Découvrez son profil, ses compétences React, ses projets et comment le contacter."
    />

    <!-- Open Graph : améliore l'aperçu du portfolio lors d'un partage sur les réseaux -->
    <meta property="og:title" content="Maurel Kouassi — Développeur Web" />
    <meta
      property="og:description"
      content="Portfolio professionnel one page de Maurel Kouassi, développeur web front-end (React, JavaScript)."
    />
    <meta property="og:type" content="website" />

    <!-- Préconnexion aux serveurs de polices Google pour accélérer leur chargement -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope (titres) et Inter (texte courant) — cf. cahier des charges, section 5. Typographie -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Point d'ancrage unique de l'application React -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
